
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find The Friend</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:#F3F7F4;
color:#183D2B;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:18px;
}

.game{
width:100%;
max-width:440px;
background:#FFFFFF;
border:1px solid #E2EBE4;
border-radius:22px;
padding:24px 20px;
box-shadow:0 12px 40px #173C2510;
}

.header{
display:flex;
justify-content:center;
align-items:center;
margin-bottom:10px;
}

.logo{
font-size:27px;
font-weight:900;
letter-spacing:-1px;
color:#183D2B;
}

.logo span{
color:#219653;
}

.subtitle{
font-size:10px;
letter-spacing:2px;
color:#8A998E;
text-align:center;
margin-bottom:28px;
}

.progress-area{
margin-bottom:20px;
}

.progress-info{
display:flex;
justify-content:space-between;
align-items:center;
font-size:11px;
font-weight:bold;
margin-bottom:9px;
}

.progress-info span:first-child{
color:#219653;
}

.progress-info span:last-child{
color:#849288;
}

.progress-track{
height:7px;
background:#E8EFEA;
border-radius:20px;
overflow:hidden;
}

.progress-fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#21A45C,#63CD86);
border-radius:20px;
transition:width .4s ease;
}

.question-card{
background:#F7FAF7;
border:1px solid #E5EDE6;
border-radius:17px;
padding:28px 17px;
text-align:center;
margin-bottom:20px;
min-height:165px;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.question-number{
font-size:10px;
font-weight:bold;
letter-spacing:1.5px;
color:#219653;
background:#E5F5E9;
padding:8px 14px;
border-radius:30px;
margin-bottom:18px;
}

.question{
font-size:25px;
font-weight:800;
line-height:1.4;
color:#183D2B;
}

.input-label{
font-size:11px;
color:#65776A;
margin-bottom:9px;
text-align:left;
font-weight:bold;
}

.input{
width:100%;
padding:16px;
background:#FAFCFA;
border:1px solid #DCE7DE;
border-radius:11px;
outline:none;
color:#183D2B;
font-size:15px;
margin-bottom:14px;
transition:.2s;
}

.input:focus{
border-color:#36A765;
box-shadow:0 0 0 3px #36A76515;
}

.input::placeholder{
color:#A2AEA5;
}

button{
width:100%;
padding:16px;
border:none;
border-radius:11px;
font-size:13px;
font-weight:800;
letter-spacing:.5px;
cursor:pointer;
transition:.2s;
}

button:active{
transform:scale(.97);
}

.check-btn{
background:linear-gradient(100deg,#168747,#29AD61);
color:white;
box-shadow:0 5px 15px #21965325;
}

.next-btn{
background:#E7F5EA;
color:#198449;
border:1px solid #C8E8D1;
margin-top:13px;
}

.result{
display:none;
margin-top:23px;
padding:22px 12px;
background:#F6FBF7;
border:1px solid #DCECE0;
border-radius:17px;
text-align:center;
animation:reveal .5s ease;
}

@keyframes reveal{
from{
opacity:0;
transform:translateY(15px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.result-label{
font-size:11px;
font-weight:bold;
letter-spacing:2px;
color:#219653;
margin-bottom:17px;
}

.friend-img{
width:175px;
height:175px;
object-fit:cover;
border-radius:17px;
border:3px solid #39A966;
box-shadow:0 5px 20px #21965320;
}

.friend-name{
font-size:27px;
font-weight:900;
margin-top:15px;
color:#176B42;
}

.answer-status{
display:inline-block;
margin-top:10px;
background:#E1F5E7;
color:#198449;
padding:8px 15px;
border-radius:30px;
font-size:10px;
font-weight:bold;
}

.footer{
margin-top:25px;
text-align:center;
font-size:10px;
letter-spacing:1.5px;
color:#A0ADA3;
}

.complete{
display:none;
text-align:center;
padding:25px 10px;
}

.complete-icon{
font-size:60px;
margin-bottom:15px;
}

.complete h2{
font-size:26px;
margin-bottom:10px;
color:#198449;
}

.complete p{
font-size:13px;
color:#7B8A7E;
line-height:1.7;
margin-bottom:22px;
}

.restart-btn{
background:linear-gradient(100deg,#168747,#29AD61);
color:white;
}
</style>
</head>

<body>

<div class="game">

<div class="header">
<div class="logo">FIND THE <span>FRIEND</span></div>
</div>

<div class="subtitle">
GUESS • REVEAL • HAVE FUN
</div>

<div id="gameContent">

<div class="progress-area">

<div class="progress-info">
<span id="questionCount">QUESTION 01</span>
<span id="percentage">0%</span>
</div>

<div class="progress-track">
<div class="progress-fill" id="progress"></div>
</div>

</div>

<div class="question-card">

<div class="question-number" id="questionNumber">
QUESTION 01
</div>

<div class="question" id="question">
Loading...
</div>

</div>

<div class="input-label">YOUR ANSWER</div>

<input
type="text"
class="input"
id="answerInput"
placeholder="Type your friend's name..."
autocomplete="off"
>

<button class="check-btn" id="checkBtn" onclick="checkAnswer()">
CHECK ANSWER
</button>

<div class="result" id="result">

<div class="result-label">
THE CORRECT ANSWER IS
</div>

<img class="friend-img" id="friendImage" src="" alt="Friend">

<div class="friend-name" id="friendName"></div>

<div class="answer-status">
✓ ANSWER REVEALED
</div>

</div>

<button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display:none">
NEXT QUESTION →
</button>

</div>

<div class="complete" id="complete">

<div class="complete-icon">🏆</div>

<h2>GAME COMPLETED!</h2>

<p>
Congratulations! You have completed all the questions.
<br>
Thanks for playing Find The Friend!
</p>

<button class="restart-btn" onclick="restartGame()">
↻ PLAY AGAIN
</button>

</div>

<div class="footer">
MADE FOR FRIENDS ❤️
</div>

</div>

<audio id="bgm" src="bgm.mp3" preload="auto"></audio>

<script>

// =====================================
// ADD YOUR QUESTIONS AND FRIENDS HERE
// =====================================

const questions = [

{
question:"Class a k beshi ghumai?",
answer:"Rafi",
image:"rafi.jpg"
},

{
question:"Class a k sobcheye beshi kotha bole?",
answer:"Friend 2",
image:"friend2.jpg"
},

{
question:"Ke sobcheye beshi late kore ashe?",
answer:"Friend 3",
image:"friend3.jpg"
},

{
question:"Ke sobcheye beshi moja kore?",
answer:"Friend 4",
image:"friend4.jpg"
},

{
question:"Ke sobcheye beshi porashona kore?",
answer:"Friend 5",
image:"friend5.jpg"
},

{
question:"Ke sobcheye beshi mobile use kore?",
answer:"Friend 6",
image:"friend6.jpg"
},

{
question:"Ke sobcheye beshi dustami kore?",
answer:"Friend 7",
image:"friend7.jpg"
}

];

// =====================================
// GAME SYSTEM
// =====================================

let currentIndex = 0;

const questionText = document.getElementById("question");
const questionNumber = document.getElementById("questionNumber");
const questionCount = document.getElementById("questionCount");
const percentage = document.getElementById("percentage");
const progress = document.getElementById("progress");

const input = document.getElementById("answerInput");
const result = document.getElementById("result");

const checkBtn = document.getElementById("checkBtn");
const nextBtn = document.getElementById("nextBtn");

const bgm = document.getElementById("bgm");

function formatNumber(number){
return String(number).padStart(2,"0");
}

// LOAD QUESTION IN SERIAL ORDER

function loadQuestion(){

if(questions.length === 0){
questionText.textContent = "No questions added yet!";
checkBtn.disabled = true;
return;
}

if(currentIndex >= questions.length){
finishGame();
return;
}

const current = questions[currentIndex];

const number = currentIndex + 1;

questionText.textContent = current.question;

questionNumber.textContent =
"QUESTION " + formatNumber(number);

questionCount.textContent =
"QUESTION " + formatNumber(number) +
" / " + formatNumber(questions.length);

const percent = Math.round(
(currentIndex / questions.length) * 100
);

percentage.textContent = percent + "%";

progress.style.width = percent + "%";

input.value = "";
input.disabled = false;

input.placeholder = "Type your friend's name...";

result.style.display = "none";

checkBtn.style.display = "block";
checkBtn.disabled = false;

nextBtn.style.display = "none";

nextBtn.textContent = "NEXT QUESTION →";

}

// CHECK ANSWER

function checkAnswer(){

if(!input.value.trim()){
input.focus();
input.placeholder = "Please enter a name!";
return;
}

const current = questions[currentIndex];

// PLAY MUSIC

bgm.currentTime = 0;

bgm.play().catch(function(){
console.log("Music could not play");
});

// SHOW ANSWER

document.getElementById("friendImage").src =
current.image;

document.getElementById("friendName").textContent =
current.answer.toUpperCase();

result.style.display = "block";

input.disabled = true;

checkBtn.style.display = "none";

nextBtn.style.display = "block";

if(currentIndex === questions.length - 1){
nextBtn.textContent = "FINISH GAME →";
}

}

// NEXT QUESTION

function nextQuestion(){

currentIndex++;

if(currentIndex >= questions.length){
finishGame();
return;
}

loadQuestion();

}

// FINISH GAME

function finishGame(){

document.getElementById("gameContent").style.display = "none";

document.getElementById("complete").style.display = "block";

progress.style.width = "100%";
percentage.textContent = "100%";

bgm.pause();
bgm.currentTime = 0;

}

// RESTART GAME

function restartGame(){

currentIndex = 0;

document.getElementById("complete").style.display = "none";

document.getElementById("gameContent").style.display = "block";

bgm.pause();
bgm.currentTime = 0;

loadQuestion();

}

// ENTER KEY SUPPORT

input.addEventListener("keydown",function(e){

if(e.key === "Enter" && !input.disabled){
checkAnswer();
}

});

// START GAME

loadQuestion();

</script>

</body>
</html>
